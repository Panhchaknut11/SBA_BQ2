name: BQ2 tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            data-cleaning/requirements.txt
            mould-ac-degradation/requirements.txt
      - name: Install declared dependencies
        run: python -m pip install -r mould-ac-degradation/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run synthetic and repository-integrity tests
        run: python -m unittest discover -s mould-ac-degradation/tests -v
